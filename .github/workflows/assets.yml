name: Update WordPress.org assets and readme

on:
  push:
    branches:
      - main

jobs:
  assets:
    name: Push assets and readme to wordpress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ne pousse que .wordpress-org/ (dossier assets/ du SVN) et readme.txt (trunk),
      # sans nouvelle version. Le code en cours sur main est ignoré : il part au tag.
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mrz-display-post-exp
          IGNORE_OTHER_FILES: true
