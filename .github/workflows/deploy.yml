name: Deploy to WordPress.org

on:
  push:
    tags:
      # Tags de version « purs » (sans préfixe v) : 1.1.0, 1.1.1, 2.0.0…
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to wordpress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mrz-display-post-exp

      # Release GitHub : zip identique au contenu wp.org (.distignore appliqué)
      # + notes extraites de l'entrée « = X.Y.Z = » du changelog de readme.txt.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION déjà existante, rien à faire."
            exit 0
          fi
          cp "$ZIP_PATH" "mrz-display-post-exp-$VERSION.zip"
          awk -v v="= $VERSION =" '$0 == v { found = 1; next } found && /^= / { exit } found' readme.txt > release-notes.md
          gh release create "$VERSION" "mrz-display-post-exp-$VERSION.zip" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest
